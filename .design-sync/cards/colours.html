<!-- @dsCard group="Foundations" name="Colours" subtitle="Brand tokens on :root - use var(--name)" -->
<!doctype html>
<html lang="ro">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../../styles.css" />
        <style>
            body {
                margin: 0;
                padding: 24px;
                background: #fff;
            }
            .sw {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
            }
            .sw figure {
                margin: 0;
            }
            .sw span {
                display: block;
                height: 72px;
                border-radius: 14px;
                box-shadow: inset 0 0 0 1px rgb(45 43 120 / 0.12);
            }
            .sw figcaption {
                margin-top: 8px;
                font-size: 13px;
                line-height: 1.4;
                color: var(--navy-950);
            }
            .sw code {
                display: block;
                font-family: 'JetBrains Mono', monospace;
                font-size: 11px;
                color: var(--ink-muted);
            }
            h3 {
                margin: 28px 0 12px;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-muted);
            }
            h3:first-child {
                margin-top: 0;
            }
        </style>
    </head>
    <body class="site-body font-sans antialiased">
        <h3 class="font-micro">Brand</h3>
        <div class="sw">
            <figure>
                <span style="background: var(--violet-500)"></span>
                <figcaption>
                    Violet<code>--violet-500 · #775afc</code>
                </figcaption>
            </figure>
            <figure>
                <span style="background: var(--purple-500)"></span>
                <figcaption>
                    Purple<code>--purple-500 · #a44cee</code>
                </figcaption>
            </figure>
            <figure>
                <span
                    style="
                        background: linear-gradient(
                            135deg,
                            var(--purple-500),
                            var(--violet-500)
                        );
                    "
                ></span>
                <figcaption>
                    Brand gradient<code>purple → violet, 135deg</code>
                </figcaption>
            </figure>
            <figure>
                <span style="background: var(--violet-cta)"></span>
                <figcaption>
                    Primary button<code
                        >--violet-cta (hover: --violet-cta-hover)</code
                    >
                </figcaption>
            </figure>
        </div>
        <h3 class="font-micro">Ink and grounds</h3>
        <div class="sw">
            <figure>
                <span style="background: var(--navy-950)"></span>
                <figcaption>Ink<code>--navy-950 · #010f1c</code></figcaption>
            </figure>
            <figure>
                <span style="background: var(--ink-muted)"></span>
                <figcaption>
                    Muted text<code>--ink-muted · #5b5f7a</code>
                </figcaption>
            </figure>
            <figure>
                <span style="background: var(--lavender-50)"></span>
                <figcaption>
                    Light section<code>--lavender-50 · #f5f3ff</code>
                </figcaption>
            </figure>
            <figure>
                <span style="background: var(--lavender-300)"></span>
                <figcaption>
                    Soft violet<code>--lavender-300 · #a18eff</code>
                </figcaption>
            </figure>
            <figure>
                <span style="background: var(--site-paper)"></span>
                <figcaption>
                    Paper<code>--site-paper · #f9f9fb</code>
                </figcaption>
            </figure>
            <figure>
                <span style="background: #1f2868"></span>
                <figcaption>
                    Dark section (hero indigo)<code
                        >#1f2868 · never near-black</code
                    >
                </figcaption>
            </figure>
        </div>
    </body>
</html>
