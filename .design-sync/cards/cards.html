<!-- @dsCard group="Cards" name="Cards" subtitle="Project card and blog post card" -->
<!doctype html>
<html lang="ro">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../../styles.css" />
        <style>
            body {
                margin: 0;
                background: #fff;
            }
            .chapter {
                padding: 32px 24px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 24px;
                align-items: start;
                list-style: none;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body class="site-body font-sans antialiased">
        <span data-intro-backdrop="" data-palette="violet" hidden=""></span>
        <section class="chapter chapter--lavender">
            <ul class="grid">
                <li>
                    <a href="/clienti" class="project-card">
                        <span class="project-card__frame" aria-hidden="true">
                            <div class="project-interface" aria-hidden="true">
                                <div class="project-interface__chrome">
                                    <i></i><i></i><i></i><span></span>
                                </div>
                                <div class="project-interface__workspace">
                                    <div class="project-interface__sidebar">
                                        <span
                                            class="project-interface__brand"
                                        ></span
                                        ><span
                                            class="project-interface__nav project-interface__nav--active"
                                        ></span
                                        ><span
                                            class="project-interface__nav"
                                        ></span
                                        ><span
                                            class="project-interface__nav"
                                        ></span>
                                    </div>
                                    <div class="project-interface__main">
                                        <div class="project-interface__toolbar">
                                            <span></span><i></i>
                                        </div>
                                        <div class="project-interface__stats">
                                            <span></span><span></span
                                            ><span></span>
                                        </div>
                                        <div class="project-interface__table">
                                            <div>
                                                <i></i><span></span><span></span
                                                ><b></b>
                                            </div>
                                            <div>
                                                <i></i><span></span><span></span
                                                ><b></b>
                                            </div>
                                            <div>
                                                <i></i><span></span><span></span
                                                ><b></b>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </span>
                        <span class="chapter-chip">Universitate</span>
                        <span class="project-card__title"
                            >Platformă de gestiune a proiectelor de
                            cercetare<span class="project-card__arrow"
                                ><svg
                                    viewBox="0 0 11 10"
                                    fill="currentColor"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M0 5.656V4.304l8.419.014-3.359-3.358L5.99 0l5.002 4.973-4.987 4.987-.93-.96 3.358-3.358L0 5.656Z"
                                    ></path></svg></span
                        ></span>
                        <span class="project-card__line"
                            >Proiecte, finanțări, deconturi și rapoarte într-un
                            singur loc.</span
                        >
                        <span class="chapter-metric"
                            ><b>240</b><span>Proiecte gestionate</span></span
                        >
                    </a>
                </li>
                <li>
                    <a href="/blog" class="post-card">
                        <span class="post-card__frame" aria-hidden="true">
                            <span class="post-card__bg"></span>
                            <span class="post-card__button"
                                ><span class="post-card__arrow"
                                    ><svg
                                        viewBox="0 0 11 10"
                                        fill="currentColor"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M0 5.656V4.304l8.419.014-3.359-3.358L5.99 0l5.002 4.973-4.987 4.987-.93-.96 3.358-3.358L0 5.656Z"
                                        ></path></svg></span
                                ><span
                                    class="post-card__arrow post-card__arrow--next"
                                    ><svg
                                        viewBox="0 0 11 10"
                                        fill="currentColor"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M0 5.656V4.304l8.419.014-3.359-3.358L5.99 0l5.002 4.973-4.987 4.987-.93-.96 3.358-3.358L0 5.656Z"
                                        ></path></svg></span
                            ></span>
                        </span>
                        <span class="post-card__meta"
                            ><span class="post-card__category">Ghiduri</span
                            ><time datetime="2026-09-22"
                                >22 septembrie 2026</time
                            ></span
                        >
                        <span class="post-card__title"
                            ><span
                                >ERP gata făcut sau construit de la zero: cum
                                alegi</span
                            ></span
                        >
                        <span class="post-card__foot">Citește articolul</span>
                    </a>
                </li>
            </ul>
        </section>
    </body>
</html>
